[project]
name = "pidash-signing-plugin"
version = "0.1.0"
description = "pi-dash stamp style and answers routes for the signr signing service"
requires-python = ">=3.12"
dependencies = ["signr-service>=0.1.0"]

[project.entry-points."signr.stamp_styles"]
proud-indian = "pidash_signing_plugin.appearance:ProudIndianStampStyle"

[project.entry-points."signr.routers"]
pidash = "pidash_signing_plugin.routes:router"

[project.optional-dependencies]
test = ["httpx>=0.28.1", "pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# signr-service isn't published yet, so uv can't lock this project. The venv is
# set up by hand (see README) and `uv run` uses it as it is.
managed = false

[tool.pytest.ini_options]
testpaths = ["tests"]
