[project]
name = "pidash-signing"
version = "0.1.0"
description = "Internal PDF signing and validation service for pi-dash governance (pyHanko)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143.3",
  "pyhanko[opentype]>=0.37.0",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
