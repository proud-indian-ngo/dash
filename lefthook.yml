pre-commit:
  parallel: false
  commands:
    fix:
      priority: 4
      glob: "*.{js,ts,jsx,tsx}"
      run: bunx oxfmt --threads=2 --no-error-on-unmatched-pattern {staged_files} && bunx oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    typecheck:
      glob: "*.{ts,tsx}"
      run: bun run check:types:affected

    check:
      glob:
        - "package.json"
        - "**/package.json"
        - "bun.lock"
      run: bun run check

    compiler:
      glob: "apps/web/src/*.{ts,tsx}"
      run: bun apps/web/scripts/check-react-compiler.ts {staged_files}

    docs:
      glob: "*.md"
      run: bun run check:docs

    test:
      glob: "*.{ts,tsx}"
      run: bun run test:unit:affected

pre-push:
  commands:
    e2e-build-cache:
      # Fills Turbo's remote cache with the E2E build so CI restores it. Only
      # clean build inputs hash like the pushed commit; a failure never blocks.
      run: |
        if ! git diff --quiet HEAD -- apps packages turbo.json bun.lock; then
          echo "Uncommitted changes; skipping the E2E build cache"
          exit 0
        fi
        bash scripts/build-e2e.sh --output-logs=errors-only || echo "E2E build failed; CI will build it"

post-checkout:
  commands:
    worktree-bootstrap:
      run: |
        MAIN_DIR=$(git worktree list --porcelain | head -1 | sed 's/worktree //')
        CURRENT_DIR=$(git rev-parse --show-toplevel)
        if [ "$MAIN_DIR" != "$CURRENT_DIR" ]; then
          if [ ! -f .env ]; then
            cp "$MAIN_DIR/.env" .env 2>/dev/null || true
            echo "Copied .env from main worktree"
          fi
          if [ ! -f CLAUDE.md ] || [ .ruler/agent-guide.md -nt CLAUDE.md ]; then
            bun run ruler:apply 2>/dev/null || true
          fi
        fi
