pre-commit:
  parallel: false
  commands:
    fix:
      priority: 4
      glob: "*.{js,ts,jsx,tsx}"
      run: bunx oxfmt --threads=2 {staged_files} && bunx oxlint --fix {staged_files}
      stage_fixed: true

    typecheck:
      glob: "*.{ts,tsx}"
      run: bun run check:types:affected

    check:
      glob:
        - "package.json"
        - "**/package.json"
        - "bun.lock"
      run: bun run check

    test:
      glob: "*.{ts,tsx}"
      run: bun run test:unit:affected

post-checkout:
  commands:
    worktree-bootstrap:
      run: |
        MAIN_DIR=$(git worktree list --porcelain | head -1 | sed 's/worktree //')
        CURRENT_DIR=$(git rev-parse --show-toplevel)
        if [ "$MAIN_DIR" != "$CURRENT_DIR" ]; then
          if [ ! -f .env ]; then
            cp "$MAIN_DIR/.env" .env 2>/dev/null || true
            echo "Copied .env from main worktree"
          fi
          if [ ! -f CLAUDE.md ] || [ .ruler/agent-guide.md -nt CLAUDE.md ]; then
            bun run ruler:apply 2>/dev/null || true
          fi
        fi
