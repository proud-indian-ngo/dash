name: CI
on:
  pull_request:
    branches: [master, "feat/kalakriti-p2-*"]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_API: "https://cache.thari.in"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TEAM: "pi-dash"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - &create-test-env
        name: Create test env
        run: |
          cat > .env <<'EOF'
          AVATAR_FALLBACK_SEED=ci
          BETTER_AUTH_SECRET=ci-secret-ci-secret-ci-secret-ci32
          BETTER_AUTH_URL=http://localhost:3001
          CORS_ORIGIN=http://localhost:3001
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/ci
          GRAVATAR_API_KEY=ci
          VITE_CDN_URL=http://localhost:3001/cdn
          VITE_ZERO_URL=ws://localhost:4848
          R2_ACCESS_KEY=ci
          R2_ACCOUNT_ID=ci
          R2_BUCKET_NAME=ci-bucket
          R2_KEY_PREFIX=attachments
          R2_SECRET_ACCESS_KEY=ci
          VOUCHER_FINANCE_ADMIN_NAME=CI Finance Admin
          VOUCHER_ORG_ADDRESS=CI Address
          VOUCHER_ORG_EMAIL=ci@org.test
          VOUCHER_ORG_NAME=CI Org
          VOUCHER_ORG_PHONE=0000000000
          VOUCHER_ORG_REGISTRATION=CI-REG
          WHATSAPP_WEBHOOK_SECRET=ci
          EOF

      - name: Type check
        run: bun run check:types
      - name: Lint
        run: bun run check
      - name: Unused exports
        run: bun run check:unused

  unit-tests:
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - *create-test-env
      # The root script caps turbo at two workspaces to fit the local commit
      # hook's memory budget; a runner has four cores to spare.
      - name: Unit tests
        timeout-minutes: 10
        run: bunx turbo run test:unit --concurrency=4 --log-order=stream --log-prefix=task

  prepare-shards:
    runs-on: ubuntu-latest
    env:
      # Keep in step with the e2e job's matrix.
      E2E_SHARDS: "8"
      TURBO_TELEMETRY_DISABLED: "1"
      SKIP_VALIDATION: "true"
      BASE_URL: "http://localhost:3099"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - name: Restore test durations cache
        uses: actions/cache/restore@v6
        with:
          path: packages/e2e/.test-durations.json
          key: e2e-durations-${{ github.ref_name }}
          restore-keys: |
            e2e-durations-${{ github.ref_name }}-
            e2e-durations-master
            e2e-durations-
      - name: Generate shard lists
        run: bun run packages/e2e/shard-by-duration.ts "$E2E_SHARDS"
      - name: Upload shard lists
        uses: actions/upload-artifact@v7
        with:
          name: shard-lists
          path: packages/e2e/shard-lists/
          retention-days: 1

  # Starts alongside prepare-shards and waits for its shard lists only before
  # the tests, so planning overlaps setup.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per shard; prepare-shards' E2E_SHARDS must match.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NODE_ENV: test
      VITE_E2E: "true"
      TEST_DB_URL: postgres://postgres:test@localhost:5433/pi-dash-test
      DATABASE_URL: postgres://postgres:test@localhost:5433/pi-dash-test
      SKIP_VALIDATION: "true"
      CI: "true"
      TURBO_TELEMETRY_DISABLED: "1"
      BETTER_AUTH_URL: http://localhost:3099
      BETTER_AUTH_SECRET: ci-test-secret-value-at-least-32-chars-long
      # Test-only key for finance-private fields; 32 bytes of 0x41 in base64.
      DATA_ENCRYPTION_KEY: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
      CORS_ORIGIN: http://localhost:3099
      R2_ACCESS_KEY: ci-test-access-key
      R2_ACCOUNT_ID: ci-test-account
      R2_BUCKET_NAME: ci-test-bucket
      R2_KEY_PREFIX: attachments
      R2_SECRET_ACCESS_KEY: ci-test-secret-access-key
      ZERO_UPSTREAM_DB: postgres://postgres:test@localhost:5433/pi-dash-test
      ZERO_REPLICA_FILE: /tmp/pi-dash-test.db
      ZERO_MUTATE_URL: http://localhost:3099/api/zero/mutate
      ZERO_QUERY_URL: http://localhost:3099/api/zero/query
      ZERO_ADMIN_PASSWORD: ci-test-admin
      SOCIAL_MEDIA_SIGNING_SECRET: ci-social-media-signing-secret-0000
      # Fake test-mode Razorpay values, the same as packages/e2e/run-e2e.sh; no
      # key secret, so the sync job never calls Razorpay.
      RAZORPAY_KEY_ID: rzp_test_e2e0000000000
      RAZORPAY_WEBHOOK_SECRET: e2e-razorpay-webhook-secret
      # The fake GoWA gateway, the same as packages/e2e/run-e2e.sh.
      E2E_GOWA_PORT: "4873"
      WHATSAPP_API_URL: http://localhost:4873
      VITE_ZERO_URL: http://localhost:4848
      VITE_CDN_URL: http://localhost:3099
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      # exclusive_last runs in shard 1 only; shard-by-duration.ts plans for it.
      E2E_SKIP_EXCLUSIVE_LAST: ${{ matrix.shard != 1 }}
    steps:
      # Loading the cached image is faster than pulling it from Docker Hub.
      - name: Cache Postgres image
        uses: actions/cache@v6
        with:
          path: /tmp/postgres-image.tar
          key: postgres-image-${{ runner.os }}-18
      # Loads and starts in the background; "Wait for Postgres" checks it. A
      # service container waits on a backed-off health check and needs a
      # restart to enable logical replication.
      - name: Start Postgres
        run: |
          (
            if [ -f /tmp/postgres-image.tar ]; then
              docker load -i /tmp/postgres-image.tar
            else
              docker pull postgres:18 && docker save postgres:18 -o /tmp/postgres-image.tar
            fi
            docker run -d --name postgres -p 5433:5432 \
              -e POSTGRES_DB=pi-dash-test -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=test \
              postgres:18 -c wal_level=logical -c max_connections=300
          ) > /tmp/postgres.log 2>&1 &

      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Resolve zero-cache image and Playwright version
        id: zero-cache
        run: |
          ZERO_VERSION=$(bun -e 'const text = await Bun.file("bun.lock").text(); const match = text.match(/"@rocicorp\/zero": \["@rocicorp\/zero@([^"]+)"/); if (!match) throw new Error("Could not resolve @rocicorp/zero version from bun.lock"); console.log(match[1]);')
          PLAYWRIGHT_VERSION=$(bun -e 'const text = await Bun.file("bun.lock").text(); const match = text.match(/"playwright-core": \["playwright-core@([^"]+)"/); if (!match) throw new Error("Could not resolve playwright-core version from bun.lock"); console.log(match[1]);')
          echo "version=${ZERO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=rocicorp/zero:${ZERO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "playwright=${PLAYWRIGHT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache zero-cache image
        uses: actions/cache@v6
        with:
          path: /tmp/zero-cache-image.tar
          key: zero-cache-${{ runner.os }}-${{ steps.zero-cache.outputs.version }}
      # Load in the background; "Start zero-cache" waits for it.
      - name: Start zero-cache image load
        run: |
          (
            if [ -f /tmp/zero-cache-image.tar ]; then
              docker load -i /tmp/zero-cache-image.tar
            else
              docker pull "${{ steps.zero-cache.outputs.image }}" &&
                docker save "${{ steps.zero-cache.outputs.image }}" -o /tmp/zero-cache-image.tar
            fi > /tmp/zero-image.log 2>&1
            echo $? > /tmp/zero-image.exit
          ) > /dev/null 2>&1 &

      - run: bun install --frozen-lockfile

      - name: Start fake GoWA
        run: |
          (bun packages/e2e/fake-gowa.ts > /tmp/gowa.log 2>&1 &)
          for _ in $(seq 1 30); do
            if curl -sf "$WHATSAPP_API_URL/health" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "fake GoWA failed to start"
          cat /tmp/gowa.log
          exit 1

      # Restore the build from Turbo's remote cache (the pre-push hook fills
      # it) or build while Postgres, Playwright and zero-cache get ready.
      # "Wait for web build" collects the result before the tests start.
      - name: Start web build
        run: |
          (bash scripts/build-e2e.sh > /tmp/web-build.log 2>&1; echo $? > /tmp/web-build.exit) > /dev/null 2>&1 &

      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 60); do
            if pg_isready -h localhost -p 5433 -U postgres >/dev/null 2>&1; then
              echo "postgres ready"
              exit 0
            fi
            sleep 1
          done
          echo "postgres failed to start"
          cat /tmp/postgres.log
          docker logs postgres 2>&1 | tail -50
          exit 1

      - name: Push schema to test database
        run: cd packages/db && bunx drizzle-kit push

      - name: Restrict Zero replication
        run: bun packages/zero/scripts/prepare-publication.ts

      - name: Seed test users
        run: cd packages/e2e && bun run helpers/seed-test-user.ts

      # Boots in the background while the browser cache restores; "Wait for
      # zero-cache" checks it.
      - name: Start zero-cache
        run: |
          until [ -f /tmp/zero-image.exit ]; do sleep 1; done
          cat /tmp/zero-image.log
          [ "$(cat /tmp/zero-image.exit)" = 0 ]
          docker run -d --name zero-cache --network host \
            -e ZERO_UPSTREAM_DB="$ZERO_UPSTREAM_DB" \
            -e ZERO_APP_PUBLICATIONS=pi_dash_public \
            -e ZERO_CVR_DB="$ZERO_UPSTREAM_DB" \
            -e ZERO_CHANGE_DB="$ZERO_UPSTREAM_DB" \
            -e ZERO_REPLICA_FILE="$ZERO_REPLICA_FILE" \
            -e ZERO_MUTATE_URL="$ZERO_MUTATE_URL" \
            -e ZERO_QUERY_URL="$ZERO_QUERY_URL" \
            -e ZERO_MUTATE_FORWARD_COOKIES=true \
            -e ZERO_QUERY_FORWARD_COOKIES=true \
            -e ZERO_ADMIN_PASSWORD="$ZERO_ADMIN_PASSWORD" \
            -e ZERO_LOG_LEVEL=info \
            "${{ steps.zero-cache.outputs.image }}"

      - name: Restore Playwright cache
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.zero-cache.outputs.playwright }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Save Playwright cache
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.zero-cache.outputs.playwright }}

      - name: Wait for zero-cache
        run: |
          # Root path, not /keepalive
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:4848/ >/dev/null 2>&1; then
              echo "zero-cache ready"
              exit 0
            fi
            sleep 1
          done
          echo "zero-cache failed to start"
          docker logs zero-cache
          exit 1

      - name: Wait for shard lists
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          until gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].name' | grep -qx shard-lists; do
            sleep 2
          done
      - name: Download shard lists
        uses: actions/download-artifact@v8
        with:
          name: shard-lists
          path: packages/e2e/shard-lists/

      - name: Wait for web build
        timeout-minutes: 10
        run: |
          until [ -f /tmp/web-build.exit ]; do sleep 1; done
          status=$(cat /tmp/web-build.exit)
          if [ "$status" != 0 ]; then
            cat /tmp/web-build.log
            exit "$status"
          fi
          tail -n 5 /tmp/web-build.log

      - name: Run Playwright tests
        run: bunx playwright test --config packages/e2e/playwright.config.ts --test-list=packages/e2e/shard-lists/shard-${{ matrix.shard }}.txt

      - name: Upload test durations
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-durations-${{ matrix.shard }}
          path: packages/e2e/.test-durations.json
          include-hidden-files: true
          retention-days: 1

      - name: Zero-cache logs
        if: failure()
        run: |
          echo "=== zero-cache container status ==="
          docker inspect zero-cache --format 'status={{.State.Status}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' 2>/dev/null || echo "container not found"
          echo "=== zero-cache logs (last 100 lines) ==="
          docker logs --tail 100 zero-cache 2>&1 || echo "no logs available"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: packages/e2e/playwright-report/
          retention-days: 14

  e2e-status:
    # Skip when the run is cancelled (a newer push or base change supersedes
    # it); the newer run reports the result. A real E2E failure still fails.
    if: ${{ !cancelled() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check E2E results
        run: |
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "E2E tests failed (result: ${{ needs.e2e.result }})"
            exit 1
          fi
      - name: Download all duration artifacts
        if: needs.e2e.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: test-durations-*
          path: /tmp/durations
      - name: Restore previous durations
        if: needs.e2e.result == 'success'
        uses: actions/cache/restore@v6
        with:
          path: packages/e2e/.test-durations.json
          key: e2e-durations-${{ github.ref_name }}
          restore-keys: |
            e2e-durations-${{ github.ref_name }}-
            e2e-durations-master
            e2e-durations-
      - name: Merge durations
        if: needs.e2e.result == 'success'
        run: |
          # Keeps the tests this run saw, each averaged with its previous
          # duration, so one slow or fast run moves the shard plan only halfway.
          node <<'EOF'
          const fs = require("fs");
          const file = "packages/e2e/.test-durations.json";
          const previous = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, "utf8")) : {};
          const merged = {};
          for (const dir of fs.readdirSync("/tmp/durations")) {
            const shardFile = `/tmp/durations/${dir}/.test-durations.json`;
            if (!fs.existsSync(shardFile)) continue;
            for (const [test, ms] of Object.entries(JSON.parse(fs.readFileSync(shardFile, "utf8")))) {
              merged[test] = test in previous ? Math.round((previous[test] + ms) / 2) : ms;
            }
          }
          fs.mkdirSync("packages/e2e", { recursive: true });
          fs.writeFileSync(file, JSON.stringify(merged, null, 2));
          console.log(`Merged durations: ${Object.keys(merged).length} tests`);
          EOF
      - name: Save durations cache
        if: needs.e2e.result == 'success'
        uses: actions/cache/save@v6
        with:
          path: packages/e2e/.test-durations.json
          key: e2e-durations-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
