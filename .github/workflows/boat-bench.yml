name: Boat benchmark
# Runs CI's checks and unit-tests jobs in boat.dev sandboxes to compare their
# times with CI's runners. Each sandbox starts from boat's base image, since the
# free trial has no saved snapshots, and installs CI's Bun version first.
on:
  workflow_dispatch:
    inputs:
      type:
        description: Sandbox size (default is 4 vCPU, 8 GB)
        type: choice
        options: [default, small, large]
        default: default

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same commands as ci.yml's jobs of the same name.
          - job: checks
            turbo: true
            command: bun run check:types && bun run check && bun run check:unused
          - job: unit-tests
            turbo: false
            command: bunx turbo run test:unit --concurrency=4 --log-order=stream --log-prefix=task
    name: ${{ matrix.job }}
    env:
      BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the Boat CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://boat.dev/api/boat/cli/download?platform=linux-x64&channel=prod" \
            -o "$HOME/.local/bin/boat"
          chmod +x "$HOME/.local/bin/boat"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sign in
        run: printf '%s' "$BOAT_API_KEY" | boat login --key-stdin --json

      - name: Create a sandbox
        id: sandbox
        run: |
          env=(-e TURBO_TELEMETRY_DISABLED=1)
          if [ "${{ matrix.turbo }}" = true ]; then
            env+=(-e TURBO_API=https://cache.thari.in -e TURBO_TEAM=pi-dash
              -e "TURBO_TOKEN=$TURBO_TOKEN" -e "TURBO_REMOTE_CACHE_SIGNATURE_KEY=$TURBO_REMOTE_CACHE_SIGNATURE_KEY")
          fi
          id=$(boat new --type "${{ inputs.type }}" --ttl 1800 "${env[@]}" --json |
            jq -r 'select(.event == "ready") | .id')
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Copy the code
        run: |
          git archive --format=tar.gz -o /tmp/src.tgz HEAD
          boat scp /tmp/src.tgz "${{ steps.sandbox.outputs.id }}:/home/user/src.tgz"
          boat exec "${{ steps.sandbox.outputs.id }}" "mkdir -p repo && tar xzf src.tgz -C repo && cd repo && cp .github/ci.env .env && git init -q && git add -A"

      - name: Install Bun and dependencies
        run: |
          bun_version=$(grep -m1 -oE 'bun-version: "[^"]+"' .github/workflows/ci.yml | cut -d'"' -f2)
          boat exec "${{ steps.sandbox.outputs.id }}" --cwd repo --timeout 600 --stream -- \
            bash -lc "curl -fsSL https://bun.sh/install | bash -s bun-v$bun_version >/dev/null &&
              export PATH=\$HOME/.bun/bin:\$PATH && bun --version && bun install --frozen-lockfile"

      - name: Run ${{ matrix.job }}
        run: |
          boat exec "${{ steps.sandbox.outputs.id }}" --cwd repo --timeout 900 --stream -- \
            bash -lc 'export PATH=$HOME/.bun/bin:$PATH && ${{ matrix.command }}'

      - name: Delete the sandbox
        if: always() && steps.sandbox.outputs.id != ''
        run: boat delete "${{ steps.sandbox.outputs.id }}" --yes --json
