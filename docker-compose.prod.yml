name: pi-dash

x-db-url: &db-url postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@tailscale-postgres:5432/${POSTGRES_DB:-pi-dash}

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      TZ: Asia/Kolkata
      DATABASE_URL: *db-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ZERO_URL: ${VITE_ZERO_URL}
        VITE_CDN_URL: ${VITE_CDN_URL}
        VITE_IMMICH_URL: ${VITE_IMMICH_URL:-}
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
        VITE_APP_ENV: ${APP_ENV:-production}
        POSTHOG_CLI_PROJECT_ID: ${POSTHOG_CLI_PROJECT_ID:-386098}
      # Source map upload key; unset uploads nothing (see DEPLOYMENT.md)
      secrets:
        - posthog_cli_api_key
    expose:
      - 3000
    environment:
      DATABASE_URL: *db-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      VITE_ZERO_URL: ${VITE_ZERO_URL}
      GRAVATAR_API_KEY: ${GRAVATAR_API_KEY:-}
      AVATAR_FALLBACK_SEED: ${AVATAR_FALLBACK_SEED:-}
      GRAVATAR_API_BASE_URL: ${GRAVATAR_API_BASE_URL:-https://api.gravatar.com/v3}
      GRAVATAR_TIMEOUT_MS: ${GRAVATAR_TIMEOUT_MS:-5000}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      # Razorpay Payment Page ingestion; off unless KEY_ID and WEBHOOK_SECRET are set
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_KEY_PREFIX: ${R2_KEY_PREFIX:-}
      VITE_CDN_URL: ${VITE_CDN_URL:-}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-http://tailscale-gowa:3000}
      WHATSAPP_AUTH_USER: ${WHATSAPP_AUTH_USER:-}
      WHATSAPP_AUTH_PASS: ${WHATSAPP_AUTH_PASS:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
      WHATSAPP_CLOUD_ACCESS_TOKEN: ${WHATSAPP_CLOUD_ACCESS_TOKEN:-}
      WHATSAPP_CLOUD_APP_SECRET: ${WHATSAPP_CLOUD_APP_SECRET:-}
      WHATSAPP_CLOUD_BUSINESS_ACCOUNT_ID: ${WHATSAPP_CLOUD_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_CLOUD_GRAPH_VERSION: ${WHATSAPP_CLOUD_GRAPH_VERSION:-}
      WHATSAPP_CLOUD_PHONE_NUMBER_ID: ${WHATSAPP_CLOUD_PHONE_NUMBER_ID:-}
      WHATSAPP_CLOUD_VERIFY_TOKEN: ${WHATSAPP_CLOUD_VERIFY_TOKEN:-}
      APP_URL: ${APP_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      IMMICH_INTERNAL_URL: ${IMMICH_INTERNAL_URL:-}
      # signs the social API's photo links; unset disables /api/social/v1 photos
      SOCIAL_MEDIA_SIGNING_SECRET: ${SOCIAL_MEDIA_SIGNING_SECRET:-}
      VOUCHER_ORG_NAME: ${VOUCHER_ORG_NAME}
      VOUCHER_ORG_ADDRESS: ${VOUCHER_ORG_ADDRESS}
      VOUCHER_ORG_PHONE: ${VOUCHER_ORG_PHONE}
      VOUCHER_ORG_EMAIL: ${VOUCHER_ORG_EMAIL}
      VOUCHER_ORG_REGISTRATION: ${VOUCHER_ORG_REGISTRATION}
      VOUCHER_FINANCE_ADMIN_NAME: ${VOUCHER_FINANCE_ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      VITE_IMMICH_URL: ${VITE_IMMICH_URL:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-pi-dash}
      APP_ENV: ${APP_ENV:-production}
      # internal pyHanko service for governance PDFs (services/signing); issuing circulars, minutes and declarations needs it
      SIGNING_SERVICE_URL: ${SIGNING_SERVICE_URL:-http://signing:8080}
      SIGNING_SERVICE_TOKEN: ${SIGNING_SERVICE_TOKEN:-}
      # rebuilds proudindian.ngo when the public events feed changes (sync-public-events-deploy); unset disables it
      WEBSITE_DISPATCH_TOKEN: ${WEBSITE_DISPATCH_TOKEN:-}
      TZ: Asia/Kolkata
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      zero-cache:
        condition: service_healthy
    restart: unless-stopped

  gowa:
    image: ghcr.io/aldinokemal/go-whatsapp-web-multidevice:v9.6.0
    pull_policy: always
    environment:
      APP_UI_ENABLED: "true"
      APP_UI_AUTO_UPDATE: "true"
      WHATSAPP_WEBHOOK: ${WHATSAPP_WEBHOOK:-}
      WHATSAPP_WEBHOOK_EVENTS: message,message.ack
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
    volumes:
      - whatsapp_data:/app/storages
    command:
      - rest
      - --basic-auth=${WHATSAPP_AUTH_USER:-admin}:${WHATSAPP_AUTH_PASS:-admin}
      - --port=3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - tailscale-gowa
    network_mode: service:tailscale-gowa
    restart: unless-stopped

  tailscale-gowa:
    image: tailscale/tailscale:v1.104.1
    hostname: gowa
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_EXTRA_ARGS: --advertise-tags=tag:container,tag:internal-app
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/tailscale/gowa.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale_gowa_data:/var/lib/tailscale
      - ${TAILSCALE_CONFIG_DIR:-/root/.config}:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      TZ: Asia/Kolkata
      POSTGRES_DB: ${POSTGRES_DB:-pi-dash}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=auto
      - -c
      - track_io_timing=on
      # Timestamp columns hold UTC; the container's TZ must not leak into now()
      - -c
      - timezone=UTC
    volumes:
      - postgres18_data:/var/lib/postgresql
    depends_on:
      - tailscale-postgres
    network_mode: service:tailscale-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tailscale-postgres:
    image: tailscale/tailscale:v1.104.1
    hostname: pi-dash-db
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_EXTRA_ARGS: --advertise-tags=tag:container,tag:internal-app
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - tailscale_postgres_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  # The governance signing service. No published port:
  # only the web service reaches it, over the compose network.
  signing:
    build:
      context: services/signing
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Kolkata
      SIGNING_SERVICE_TOKEN: ${SIGNING_SERVICE_TOKEN:-}
      SIGNING_ALLOW_FETCHING: ${SIGNING_ALLOW_FETCHING:-false}
    expose:
      - 8080
    restart: unless-stopped

  zero-cache:
    image: rocicorp/zero:1.11.1
    ports:
      - 4848
    environment:
      TZ: Asia/Kolkata
      ZERO_UPSTREAM_DB: *db-url
      ZERO_APP_PUBLICATIONS: pi_dash_public
      ZERO_CVR_DB: *db-url
      ZERO_CHANGE_DB: *db-url
      ZERO_REPLICA_FILE: /data/zero.db
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD:-}
      ZERO_OPERATOR_PASSWORD: ${ZERO_OPERATOR_PASSWORD:-}
      ZERO_MUTATE_FORWARD_COOKIES: "true"
      ZERO_MUTATE_URL: http://web:${PORT:-3000}/api/zero/mutate
      ZERO_QUERY_FORWARD_COOKIES: "true"
      ZERO_QUERY_URL: http://web:${PORT:-3000}/api/zero/query
      ZERO_LOG_LEVEL: ${ZERO_LOG_LEVEL:-info}
      ZERO_QUERY_HYDRATION_STATS: ${ZERO_QUERY_HYDRATION_STATS:-false}
      # Log and metric export are opt-in: set the exporter to otlp, its endpoint and the headers
      OTEL_LOGS_EXPORTER: ${ZERO_OTEL_LOGS_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${ZERO_OTEL_LOGS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${ZERO_OTEL_HEADERS:-}
      OTEL_METRICS_EXPORTER: ${ZERO_OTEL_METRICS_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${ZERO_OTEL_METRICS_ENDPOINT:-}
      OTEL_TRACES_EXPORTER: "none"
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.name=zero-cache}
      OTEL_NODE_RESOURCE_DETECTORS: ${OTEL_NODE_RESOURCE_DETECTORS:-env,host,os}
    volumes:
      - zero_cache_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4848/keepalive"]
      interval: 5s
      timeout: 5s
      retries: 5
      # zero-cache reports ready only once replication has caught up
      start_period: 120s
    restart: unless-stopped

# A file secret outside the build context needs a Buildx entitlement under
# Compose's Bake builder, so the key comes from the environment instead.
secrets:
  posthog_cli_api_key:
    environment: POSTHOG_CLI_API_KEY

volumes:
  postgres18_data:
  zero_cache_data:
  whatsapp_data:
  tailscale_gowa_data:
  tailscale_postgres_data:
