name: pi-dash

# The web app runs outside this stack, as a Dokploy Application (DEPLOYMENT.md#web-app)
x-db-url: &db-url postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@tailscale-postgres:5432/${POSTGRES_DB:-pi-dash}

services:
  postgres:
    # Pinned to the patch release so an upgrade is a deliberate, planned restart
    image: postgres:18.6
    environment:
      TZ: Asia/Kolkata
      POSTGRES_DB: ${POSTGRES_DB:-pi-dash}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=logical
      # Two web containers overlap during a rolling deploy, each with its
      # Drizzle and pg-boss pools, alongside zero-cache (data-layer.md)
      - -c
      - max_connections=300
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=auto
      - -c
      - track_io_timing=on
      # Timestamp columns hold UTC; the container's TZ must not leak into now()
      - -c
      - timezone=UTC
    volumes:
      - postgres18_data:/var/lib/postgresql
    depends_on:
      - tailscale-postgres
    network_mode: service:tailscale-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tailscale-postgres:
    image: tailscale/tailscale:v1.104.2
    hostname: pi-dash-db
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_EXTRA_ARGS: --advertise-tags=tag:container,tag:internal-app
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - tailscale_postgres_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    # Postgres shares this container's network, so the alias reaches it
    networks:
      default:
      dokploy-network:
        aliases: [pi-dash-postgres]
    restart: unless-stopped

  # The governance signing service: the generic signr image with the pi-dash
  # plugin. No published port: only the web app reaches it, over the Dokploy
  # network.
  signing:
    build:
      context: services/signing-plugin
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Kolkata
      SIGNING_SERVICE_TOKEN: ${SIGNING_SERVICE_TOKEN:-}
      SIGNING_ALLOW_FETCHING: ${SIGNING_ALLOW_FETCHING:-false}
    expose:
      - 8080
    networks:
      default:
      dokploy-network:
        aliases: [pi-dash-signing]
    restart: unless-stopped

  zero-cache:
    image: rocicorp/zero:1.11.3
    expose:
      - 4848
    environment:
      TZ: Asia/Kolkata
      ZERO_UPSTREAM_DB: *db-url
      ZERO_APP_PUBLICATIONS: pi_dash_public
      ZERO_CVR_DB: *db-url
      ZERO_CHANGE_DB: *db-url
      ZERO_REPLICA_FILE: /data/zero.db
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD:-}
      ZERO_OPERATOR_PASSWORD: ${ZERO_OPERATOR_PASSWORD:-}
      ZERO_MUTATE_FORWARD_COOKIES: "true"
      ZERO_MUTATE_URL: ${WEB_INTERNAL_URL:?the web Application's service URL}/api/zero/mutate
      ZERO_QUERY_FORWARD_COOKIES: "true"
      ZERO_QUERY_URL: ${WEB_INTERNAL_URL:?the web Application's service URL}/api/zero/query
      ZERO_LOG_LEVEL: ${ZERO_LOG_LEVEL:-info}
      ZERO_QUERY_HYDRATION_STATS: ${ZERO_QUERY_HYDRATION_STATS:-false}
      # Replica backup to R2; empty leaves it off (DEPLOYMENT.md#zero-cache)
      ZERO_LITESTREAM_BACKUP_URL: ${ZERO_LITESTREAM_BACKUP_URL:-}
      ZERO_LITESTREAM_ENDPOINT: ${ZERO_LITESTREAM_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${ZERO_LITESTREAM_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${ZERO_LITESTREAM_SECRET_ACCESS_KEY:-}
      # Log and metric export are opt-in: set the exporter to otlp, its endpoint and the headers
      OTEL_LOGS_EXPORTER: ${ZERO_OTEL_LOGS_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${ZERO_OTEL_LOGS_ENDPOINT:-}
      # PostHog rejects a request body over its limit (413), and the default
      # batch of 512 records exceeds it in the log burst after a restart
      OTEL_BLRP_MAX_EXPORT_BATCH_SIZE: 100
      OTEL_EXPORTER_OTLP_HEADERS: ${ZERO_OTEL_HEADERS:-}
      OTEL_METRICS_EXPORTER: ${ZERO_OTEL_METRICS_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${ZERO_OTEL_METRICS_ENDPOINT:-}
      OTEL_TRACES_EXPORTER: "none"
      OTEL_RESOURCE_ATTRIBUTES: service.name=zero-cache
      OTEL_NODE_RESOURCE_DETECTORS: env,host,os
    volumes:
      - zero_cache_data:/data
    networks:
      - default
      - dokploy-network
    # Web applies migrations and the publication; on a fresh database,
    # zero-cache restarts until it has
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4848/keepalive"]
      interval: 5s
      timeout: 5s
      retries: 5
      # zero-cache reports ready only once replication has caught up
      start_period: 120s
    # Time to drain client WebSockets on shutdown, as Rocicorp recommends
    stop_grace_period: 10m
    restart: unless-stopped

# Dokploy's shared network, where the web Application reaches Postgres and
# signing by their aliases, and zero-cache reaches it
networks:
  dokploy-network:
    external: true

volumes:
  postgres18_data:
  zero_cache_data:
  tailscale_postgres_data:
